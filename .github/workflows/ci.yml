name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Demo
        run: python examples/demo.py
      - name: CLI smoke test
        run: |
          mkdir -p /tmp/drive/docs && echo hello > /tmp/drive/docs/a.txt
          cd /tmp/drive
          export TETHER_USER=user:ci
          tether init
          WS=$(tether create --agent agent:ci --read 'docs/**' --write 'out/**' --auto-approve 'out/**')
          tether cat "$WS" docs/a.txt
          echo summary | tether put "$WS" out/summary.md
          tether submit "$WS" --note "ci" | grep -q "merged"
          test -f out/summary.md
          tether verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tether:ci .
      - name: Isolated agent end to end
        run: |
          printf 'TETHER_ADMIN_USER=admin\nTETHER_ADMIN_PASSWORD=ci-password-long-enough\n' > .env
          docker compose up -d tether agent-api
          sleep 3
          docker compose exec -T tether sh -c 'mkdir -p /data/drive/docs && echo hi > /data/drive/docs/a.txt'
          WS=$(docker compose exec -T tether tether create --agent agent:ci --read 'docs/**' --write 'out/**')
          TOKEN=$(docker compose exec -T tether tether token "$WS")
          TETHER_TOKEN=$TOKEN docker compose --profile agent run --rm -T agent | tee agent.log
          grep -q awaiting_review agent.log
          docker compose --profile agent run --rm -T --entrypoint sh agent -c 'test ! -e /data && test ! -e /keys'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost:8700' http://127.0.0.1:8700/api/workspaces)" = 401
          docker compose exec -T tether tether verify
      - name: Logs on failure
        if: failure()
        run: docker compose logs
